<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Vincera</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --track: #e5e5e5;
        --danger: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --track: #262626;
          --danger: #f97066;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      #status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        min-height: 1.4em;
      }
      .bar {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--fg);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
      body.failed .bar {
        display: none;
      }
      body.failed #status {
        color: var(--danger);
        white-space: pre-wrap;
        max-width: 340px;
      }
      #hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        max-width: 340px;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="icon" alt="" />
      <h1>Vincera</h1>
      <div class="bar" aria-hidden="true"><span></span></div>
      <p id="status" role="status" aria-live="polite">Starting…</p>
      <p id="hint"></p>
    </main>
    <script>
      const icon = new URLSearchParams(location.search).get("icon")
      if (icon) document.getElementById("icon").src = icon
      window.setStatus = (text) => {
        document.getElementById("status").textContent = text
      }
      window.setFailed = (text, hint) => {
        document.body.classList.add("failed")
        document.getElementById("status").textContent = text
        document.getElementById("hint").textContent = hint || ""
      }
    </script>
  </body>
</html>
