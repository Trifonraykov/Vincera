# Supabase CLI project for local development with Supabase Studio (docs/supabase.md,
# CLAUDE.md §19.21). This is not the legacy bot's `supabase/` folder at the repository root,
# which the scripts never touch: they always pass `--workdir supabase-local`.
#
#   pnpm supabase:start    Postgres on localhost:54322, Studio on http://localhost:54323
#   pnpm supabase:status
#   pnpm supabase:stop     keeps the data (a Docker volume); add `--no-backup` to delete it
#
# Then set DATABASE_URL=postgres://postgres:postgres@localhost:54322/postgres in .env.local and
# run `pnpm db:migrate`. Only the database and Studio (with the gateway and postgres-meta it
# needs) run: the platform has its own auth, storage, jobs and email, and never uses the Data API.
# The CLI publishes these ports on every network interface: use it on a trusted network.
project_id = "creator-platform"

[api]
# The Data API (PostgREST) stays off: the platform never uses it. The gateway still starts,
# because Studio talks to postgres-meta through it.
enabled = false
port = 54321

[db]
port = 54322
shadow_port = 54320
# Supabase's current major version; hosted projects created today run it too.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
# Drizzle owns the schema: `pnpm db:migrate`, never `supabase db push` or `supabase db reset`.
enabled = false

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false
